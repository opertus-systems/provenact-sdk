name: Conformance Smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provenact_repo:
        description: "Optional owner/repo for substrate checkout (defaults to <this-owner>/provenact-cli)"
        required: false
        type: string

permissions:
  contents: read

env:
  PROVENACT_SUBSTRATE_PIN: 5e611c1fca7f433556a38b743d7e820de2345e47

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve provenact repository
        id: repo
        shell: bash
        run: |
          if [ -n "${{ inputs.provenact_repo }}" ]; then
            echo "repo=${{ inputs.provenact_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ github.repository_owner }}/provenact-cli" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Provenact substrate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ steps.repo.outputs.repo }}
          ref: ${{ env.PROVENACT_SUBSTRATE_PIN }}
          path: provenact

      - name: Validate checked-out substrate pin
        run: |
          ACTUAL="$(git -C provenact rev-parse HEAD)"
          if [ "$ACTUAL" != "$PROVENACT_SUBSTRATE_PIN" ]; then
            echo "substrate pin mismatch: expected $PROVENACT_SUBSTRATE_PIN, got $ACTUAL" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build provenact-cli
        working-directory: provenact
        run: cargo build -p provenact-cli

      - name: Run SDK smoke tests against vectors
        env:
          PROVENACT_VECTOR_ROOT: ${{ github.workspace }}/provenact
          PROVENACT_CLI_BIN: ${{ github.workspace }}/provenact/target/debug/provenact-cli
        run: cargo test --test conformance_smoke -- --nocapture

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript SDK deps
        working-directory: typescript
        run: npm ci

      - name: Run TypeScript SDK smoke test against vectors
        working-directory: typescript
        env:
          PROVENACT_VECTOR_ROOT: ${{ github.workspace }}/provenact
          PROVENACT_CLI_BIN: ${{ github.workspace }}/provenact/target/debug/provenact-cli
        run: npm test
